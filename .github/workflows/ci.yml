name: CARAMELO CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check assets/data.js
          node --check assets/chapter1-v4.js
          node --check assets/chapter2-v4.js
          node --check assets/chapter3-v4.js
          node --check assets/chapter4-v4.js
          node --check assets/chapter5-v4.js
          node --check assets/scoring-v4.js
          node --check assets/vocational-core.js
          node --check assets/app.js
          node --check assets/journey.js
          node --check assets/day5.js
          node --check assets/day6.js
          node --check assets/day7.js
          node --check assets/demo-v4.js
          node --check assets/journey-ui.js
          node --check assets/result-rings.js
          node --check assets/profile-visuals.js

      - name: Run structural smoke tests
        run: node tests/smoke.cjs
